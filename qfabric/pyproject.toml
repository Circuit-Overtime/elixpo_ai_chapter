[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qfabric"
version = "1.0.2"
description = "Contract-driven recovery across Linux and RTOS execution domains"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Ayushman Bhattacharya", email = "ayushman@myceli.ai" },
  { name = "Anwesha Chakraborty", email = "anwesha.elixpo@gmail.com" },
]
requires-python = ">=3.11"
keywords = [
  "embedded-systems",
  "linux",
  "rtos",
  "runtime-verification",
  "timing-contracts",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware",
]
dependencies = [
  "arduino-router-bridge>=0.5.1",
]

[project.urls]
Homepage = "https://github.com/elixpo/qfabric"
Documentation = "https://github.com/elixpo/qfabric/tree/main/docs"
Issues = "https://github.com/elixpo/qfabric/issues"
Repository = "https://github.com/elixpo/qfabric"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "ruff>=0.8",
  "twine>=5.1",
]

[project.scripts]
qf = "qfabric.cli:main"
qf-stage1 = "qfabric_stage1.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
