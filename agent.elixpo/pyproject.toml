[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elixpoo"
version = "2.0.0"
description = "Elixpoo — Elixpo's policy-bound GitHub project-management agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ayushman Bhattacharya", email = "ayushman@pollinations.ai" },
]
keywords = ["github", "project-management", "pollinations", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyJWT>=2.10.0",
    "cryptography>=44.0.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "tiktoken>=0.8.0",
]

[project.urls]
Homepage = "https://agent.elixpo.com"
Documentation = "https://agent.elixpo.com/docs"
Repository = "https://github.com/elixpo/agent.elixpo"
Issues = "https://github.com/elixpo/agent.elixpo/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "rtk", "lib"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["agents", "rtk", "lib", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N818"]  # exception names (BudgetExceeded, RoleNotFound, PathEscape) are intentional

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
