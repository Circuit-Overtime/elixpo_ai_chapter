name: Elixpoo v2 reusable merge memory

on:
  workflow_call:
    secrets:
      github_token:
        required: true
      gist_token:
        required: true
      pollinations_key:
        required: true
      gist_id:
        required: true

jobs:
  remember:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: elixpo/agent.elixpo
          ref: ${{ vars.ELIXPOO_RUNTIME_REF || 'v2' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Write one revision-checked merge record
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
          ELIXPOO_GIST_AGENTIC_TOKEN: ${{ secrets.gist_token }}
          ELIXPOO_FOLLOWUP_GIST_ID: ${{ secrets.gist_id }}
          ELIXPO_POLLINATIONS_API_KEY: ${{ secrets.pollinations_key }}
        run: python -m agents.elixpoo_v2 merge-memory
