name = "elixpo-pay"
compatibility_date = "2025-12-16"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages project
pages_build_output_dir = ".vercel/output/static"

# Cloudflare D1 — elixpo_pay (relational ledger / entities)
[[d1_databases]]
binding = "DB"
database_name = "elixpo_pay"
database_id = "e12163b1-a199-4fe8-9605-ade36936ba07"
migrations_dir = "src/workers/migrations"

# Cloudflare KV — idempotency keys, handoff/session cache, webhook replay guard
[[kv_namespaces]]
binding = "KV"
id = "5fcc8927beed4a6690d7f5b168fe1a62"

# Production environment
[env.production]
vars = { ENVIRONMENT = "production", RAZORPAY_MODE = "live" }

  [[env.production.d1_databases]]
  binding = "DB"
  database_name = "elixpo_pay"
  database_id = "e12163b1-a199-4fe8-9605-ade36936ba07"
  migrations_dir = "src/workers/migrations"

  [[env.production.kv_namespaces]]
  binding = "KV"
  id = "5fcc8927beed4a6690d7f5b168fe1a62"

# Preview environment
[env.preview]
vars = { ENVIRONMENT = "preview" }

  [[env.preview.d1_databases]]
  binding = "DB"
  database_name = "elixpo_pay"
  database_id = "e12163b1-a199-4fe8-9605-ade36936ba07"
  migrations_dir = "src/workers/migrations"

  [[env.preview.kv_namespaces]]
  binding = "KV"
  id = "5fcc8927beed4a6690d7f5b168fe1a62"
