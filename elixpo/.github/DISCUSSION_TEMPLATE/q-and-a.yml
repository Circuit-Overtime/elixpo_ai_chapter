title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        Ask a focused question about using, contributing to, or understanding Elixpo work. Include enough public context for another person to answer without guessing. Do not post credentials, private account data, or undisclosed security reports.
  - type: input
    id: project
    attributes:
      label: Related project, service, or research record
      description: Name the Elixpo work involved and link its dossier, repository, or public page.
      placeholder: https://elixpo.com/projects/...
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: State the specific question and the outcome you are trying to reach.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you already tried?
      description: Link relevant documentation and include concise commands, versions, or public examples where useful.
    validations:
      required: false
  - type: checkboxes
    id: public-data
    attributes:
      label: Public-data check
      options:
        - label: I have removed secrets, personal data, private logs, and undisclosed vulnerability details.
          required: true
