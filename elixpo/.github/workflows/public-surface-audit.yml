name: Public surface audit

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

concurrency:
  group: public-surface-audit-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crawl:
    name: Crawl SEO and delivery contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Audit all public surfaces
        run: python3 scripts/audit-public-surfaces.py --strict --json audit/public-surfaces.json --markdown audit/public-surfaces.md
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-surface-audit
          path: audit/
          if-no-files-found: error
          retention-days: 30

  lighthouse:
    name: Browser performance and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Audit representative public routes
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-results
