name: Content registry

on:
  pull_request:
    paths:
      - "content/**"
      - "readme/**"
      - "docs/readme/generated/**"
      - "scripts/validate-registry.mjs"
      - "scripts/render-readmes.mjs"
      - "src/lib/directory.ts"
      - ".github/workflows/content-registry.yml"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "readme/**"
      - "docs/readme/generated/**"
      - "scripts/validate-registry.mjs"
      - "scripts/render-readmes.mjs"
      - "src/lib/directory.ts"
      - ".github/workflows/content-registry.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate canonical content
        run: npm run registry:check
      - name: Verify generated READMEs
        run: npm run readme:check
