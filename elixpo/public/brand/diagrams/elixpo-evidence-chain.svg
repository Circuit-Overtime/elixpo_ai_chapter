<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">The Elixpo evidence chain</title>
  <desc id="description">Repository facts, accountable review, and released artifacts become an inspectable public record with status, attribution, and durable links.</desc>
  <style>
    :root{color-scheme:light dark}.paper{fill:#f6f5f0}.ink{fill:#142018}.muted{fill:#526059}.line{stroke:#93a59a}.field{fill:#0b623c}.blue{fill:#e4ebfa}.warm{fill:#f0e6d3}.white{fill:#fff}.label{font:700 15px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px}.title{font:650 34px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1px}.body{font:500 18px ui-sans-serif,system-ui,sans-serif}.small{font:500 15px ui-sans-serif,system-ui,sans-serif}@media(prefers-color-scheme:dark){.paper{fill:#101712}.ink{fill:#f6f5f0}.muted{fill:#bdc8c0}.line{stroke:#637269}.blue{fill:#253246}.warm{fill:#29342c}.field{fill:#18a466}}
  </style>
  <rect class="paper" width="1200" height="560" rx="36"/>
  <circle class="blue" cx="1110" cy="-10" r="250" opacity=".72"/>
  <circle cx="1090" cy="20" r="165" fill="none" class="line" opacity=".55"/>
  <text x="64" y="70" class="label muted">ELIXPO / EVIDENCE CHAIN</text>
  <text x="64" y="119" class="title ink">A public claim should lead back to inspectable evidence.</text>

  <path d="M354 280H423M777 280H846" fill="none" class="line" stroke-width="2"/>
  <path d="M413 272l12 8-12 8M836 272l12 8-12 8" fill="none" class="line" stroke-width="2"/>

  <rect x="64" y="183" width="290" height="194" rx="28" class="warm"/>
  <text x="92" y="221" class="label muted">01 / SOURCE FACTS</text>
  <text x="92" y="264" class="title ink">Repository</text>
  <text x="92" y="300" class="body ink">Source · license · maintainer</text>
  <text x="92" y="338" class="small muted">Canonical links preserve where each</text>
  <text x="92" y="360" class="small muted">claim came from and when it was checked.</text>

  <rect x="425" y="161" width="350" height="238" rx="32" class="field"/>
  <text x="457" y="204" class="label white">02 / ACCOUNTABLE REVIEW</text>
  <text x="457" y="254" class="title white">Validate the boundary.</text>
  <text x="457" y="292" class="body white">Lifecycle · relationship · release</text>
  <line x1="457" y1="322" x2="743" y2="322" stroke="#fff" opacity=".3"/>
  <text x="457" y="353" class="small white">Checks record what is verified, what is</text>
  <text x="457" y="375" class="small white">editorial, and what remains unconfirmed.</text>

  <rect x="848" y="183" width="288" height="194" rx="28" class="blue"/>
  <text x="876" y="221" class="label muted">03 / PUBLIC RECORD</text>
  <text x="876" y="264" class="title ink">Evidence remains</text>
  <text x="876" y="299" class="title ink">inspectable.</text>
  <text x="876" y="338" class="small muted">Status · attribution · artifact · citation</text>

  <line x1="64" y1="448" x2="1136" y2="448" class="line"/>
  <circle cx="76" cy="501" r="7" class="field"/>
  <text x="98" y="507" class="body ink">Every public statement resolves to a source, a dated check, or a named limitation.</text>
  <text x="1136" y="507" text-anchor="end" class="label muted">SOURCE → REVIEW → RECORD</text>
</svg>
