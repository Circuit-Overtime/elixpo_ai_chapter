<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">Verified Elixpo history from 2023 to 2026</title>
  <desc id="description">A timeline showing the earliest surviving project in 2023, organization and Chapter formation in 2024, expanded contribution and research in 2025, and the project-foundry direction with standalone publication surfaces in 2026.</desc>
  <style>
    :root{color-scheme:light dark}.paper{fill:#f6f5f0}.ink{fill:#142018}.muted{fill:#526059}.line{stroke:#93a59a}.field{fill:#0b623c}.warm{fill:#f0e6d3}.label{font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px}.year{font:700 27px ui-sans-serif,system-ui,sans-serif}.body{font:500 16px ui-sans-serif,system-ui,sans-serif}.small{font:500 14px ui-sans-serif,system-ui,sans-serif}@media(prefers-color-scheme:dark){.paper{fill:#101712}.ink{fill:#f6f5f0}.muted{fill:#bdc8c0}.line{stroke:#637269}.warm{fill:#29342c}.field{fill:#18a466}}
  </style>
  <rect class="paper" width="1200" height="390" rx="36"/>
  <text x="64" y="58" class="label muted">ELIXPO / VERIFIED HISTORY</text>
  <line x1="84" y1="156" x2="1116" y2="156" class="line" stroke-width="2"/>
  <path d="M1105 148l12 8-12 8" fill="none" class="line" stroke-width="2"/>
  <g transform="translate(92 0)"><circle cx="0" cy="156" r="13" class="field"/><text x="-12" y="116" class="year ink">2023</text><rect x="-28" y="194" width="242" height="126" rx="20" class="warm"/><text x="-4" y="228" class="label muted">ORIGIN</text><text x="-4" y="260" class="body ink">Earliest surviving</text><text x="-4" y="283" class="body ink">project record.</text><text x="-4" y="306" class="small muted">OctaBit · 26 December</text></g>
  <g transform="translate(365 0)"><circle cx="0" cy="156" r="13" class="field"/><text x="-12" y="116" class="year ink">2024</text><rect x="-28" y="194" width="242" height="126" rx="20" class="warm"/><text x="-4" y="228" class="label muted">ORGANIZATION</text><text x="-4" y="260" class="body ink">GitHub organization,</text><text x="-4" y="283" class="body ink">Chapter, Hacktoberfest.</text><text x="-4" y="306" class="small muted">Public stewardship begins</text></g>
  <g transform="translate(638 0)"><circle cx="0" cy="156" r="13" class="field"/><text x="-12" y="116" class="year ink">2025</text><rect x="-28" y="194" width="242" height="126" rx="20" class="warm"/><text x="-4" y="228" class="label muted">CONTRIBUTION</text><text x="-4" y="260" class="body ink">Research and a larger</text><text x="-4" y="283" class="body ink">outside contribution cycle.</text><text x="-4" y="306" class="small muted">Evidence-backed public work</text></g>
  <g transform="translate(911 0)"><circle cx="0" cy="156" r="13" class="field"/><text x="-12" y="116" class="year ink">2026</text><rect x="-28" y="194" width="242" height="126" rx="20" class="warm"/><text x="-4" y="228" class="label muted">FOUNDRY</text><text x="-4" y="260" class="body ink">Project-foundry direction</text><text x="-4" y="283" class="body ink">and publication surfaces.</text><text x="-4" y="306" class="small muted">Registry · Research · Packages</text></g>
  <text x="64" y="361" class="small muted">Every milestone is backed by the evidence linked from elixpo.com/history.</text>
</svg>
