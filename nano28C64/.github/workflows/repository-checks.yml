name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package and hardware integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test runner
        run: python -m pip install --disable-pip-version-check --editable . pytest

      - name: Test package
        run: python -m pytest -q

      - name: Verify released hardware record
        shell: bash
        run: |
          required=(
            "README.md"
            "LICENSE"
            "hardware/README.md"
            "hardware/28c64_programmer.pdf"
          )
          for artifact in "${required[@]}"; do
            test -s "$artifact" || {
              echo "Required package or hardware artifact is missing or empty: $artifact" >&2
              exit 1
            }
          done
