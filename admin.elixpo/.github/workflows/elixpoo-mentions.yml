name: Elixpoo mentions
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
permissions: {}
concurrency:
  group: elixpoo-mention-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  respond:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: elixpo/agent.elixpo/.github/workflows/elixpoo-mention-reusable.yml@v1
    secrets:
      github_token: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
      pollinations_key: ${{ secrets.ELIXPO_POLLINATIONS_API_KEY }}
      project_token: ${{ secrets.ELIXPOO_GITHUB_PROJECT_TOKEN }}
