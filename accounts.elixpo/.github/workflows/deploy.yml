name: Accounts CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: pages
        type: choice
        options:
          - pages
          - npm
          - github
          - worker
          - vscode

concurrency:
  group: accounts-${{ github.event_name }}-${{ github.ref }}-${{ inputs.target || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: ./biome.sh ci
      - run: npm test
      - run: ./deploy.sh --package build
      - run: npm pack ./packages/accounts --dry-run

  deploy-pages:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pages')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: https://accounts.elixpo.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Validate Cloudflare credentials
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required"
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == ENC\[* ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN contains SOPS ciphertext"
            exit 1
          fi
          npx --no-install wrangler whoami

      - name: Apply D1 migrations
        run: npx --no-install wrangler d1 migrations apply elixpo_auth --remote

      - name: Build and deploy Cloudflare Pages
        run: ./deploy.sh --pages build deploy

  publish-npm:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'npm')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Publish npm package and GitHub Release
        run: ./deploy.sh --package build deploy
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'github')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build and mirror package to GitHub Packages
        run: ./deploy.sh --github build deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-worker:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'worker'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build and deploy Cloudflare Worker
        run: ./deploy.sh --worker build deploy

  publish-vscode:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'vscode'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vscode
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build and publish VS Code extension
        run: ./deploy.sh --package --vs build deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  bump-sdk-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - publish-npm
      - publish-github
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Bump SDK to next patch version
        id: next-version
        working-directory: packages/accounts
        run: |
          npm version patch --no-git-tag-version
          NEXT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit next SDK version to main
        env:
          NEXT_VERSION: ${{ steps.next-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/accounts/package.json
          git commit -m "chore: prepare @elixpo/accounts v${NEXT_VERSION} [skip release]"
          git push origin HEAD:main
