name: Elixpo Triage

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_type:
        description: Item type to backfill
        required: true
        type: choice
        options:
          - issue
          - pull_request
      target_number:
        description: Issue or pull request number
        required: true
        type: number

concurrency:
  group: elixpo-triage-${{ github.event_name }}-${{ inputs.target_type || 'event' }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.target_number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    env:
      PROJECT_TOKEN: ${{ secrets.ELIXPOO_GITHUB_PROJECT_TOKEN }}
      REPO_TOKEN: ${{ github.token }}
      POLLINATIONS_KEY: ${{ secrets.ELIXPO_POLLINATIONS_API_KEY }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Download repository context
        if: github.event_name == 'issues'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          name: repo-context
          workflow: artifact-update.yml
          path: .elixpo-context
          if_no_artifact_found: warn
          github_token: ${{ github.token }}

      - name: Complete sparse issue description
        if: github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          CONTEXT_PATH: .elixpo-context/context.md
        run: python .github/scripts/issue_description.py

      - name: Categorize event and fill project fields
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_TYPE: ${{ inputs.target_type }}
          TARGET_NUMBER: ${{ inputs.target_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$EVENT_NAME" == "issues" || "$TARGET_TYPE" == "issue" ]]; then
            export ISSUE_NUMBER="${ISSUE_NUMBER:-$TARGET_NUMBER}"
            python .github/scripts/triage_issue.py
          else
            export PR_NUMBER="${PR_NUMBER:-$TARGET_NUMBER}"
            python .github/scripts/triage_pr.py
          fi
