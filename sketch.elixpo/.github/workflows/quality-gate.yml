# Reusable quality-gate workflow for the Elixpo CI network.
# Reads .elixpo/project.yml from the calling repo to decide what to run.

name: PR quality gate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: PR quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout the calling repo ──────────────────────────────────
      - name: Checkout calling repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ── Read project manifest ──────────────────────────────────────
      - name: Read .elixpo/project.yml
        id: manifest
        shell: ruby {0}
        run: |
          require "yaml"
          manifest_path = ".elixpo/project.yml"
          output_path = ENV.fetch("GITHUB_OUTPUT")
          summary_path = ENV.fetch("GITHUB_STEP_SUMMARY")

          unless File.file?(manifest_path)
            warn "::warning::.elixpo/project.yml not found — skipping quality gate"
            File.open(output_path, "a") { |file| file.puts "exists=false" }
            exit 0
          end

          manifest = YAML.safe_load_file(manifest_path, aliases: false) || {}
          project = manifest.fetch("project", {})
          ci = manifest.fetch("ci", {})
          values = {
            "exists" => "true",
            "stack" => project.fetch("stack", "static").to_s,
            "node_version" => project.fetch("node_version", "20").to_s,
            "lint_cmd" => ci.fetch("lint_cmd", "").to_s,
            "test_cmd" => ci.fetch("test_cmd", "").to_s,
            "build_cmd" => ci.fetch("build_cmd", "").to_s,
          }

          File.open(output_path, "a") do |file|
            values.each do |key, value|
              delimiter = "ELIXPO_#{key.upcase}"
              file.puts "#{key}<<#{delimiter}", value, delimiter
            end
          end

          File.open(summary_path, "a") do |file|
            file.puts "### Manifest values", "", "| Key | Value |", "| --- | --- |"
            values.reject { |key, _| key == "exists" }.each do |key, value|
              file.puts "| #{key} | `#{value.gsub("|", "\\|")}` |"
            end
          end

      # ── Static: nothing to do ──────────────────────────────────────
      - name: Static project — no build needed
        if: steps.manifest.outputs.exists == 'true' && steps.manifest.outputs.stack == 'static'
        run: echo "Static project — no build needed."

      # ── Node.js setup ───────────────────────────────────────────────
      - name: Setup Node.js
        if: >-
          steps.manifest.outputs.exists == 'true'
          && contains(fromJSON('["nextjs", "software-monorepo", "hosted-service", "incubating-service"]'), steps.manifest.outputs.stack)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.manifest.outputs.node_version }}
          cache: npm

      - name: Install Node dependencies
        if: >-
          steps.manifest.outputs.exists == 'true'
          && contains(fromJSON('["nextjs", "software-monorepo", "hosted-service", "incubating-service"]'), steps.manifest.outputs.stack)
        run: npm ci

      # ── Python setup ───────────────────────────────────────────────
      - name: Setup Python
        if: steps.manifest.outputs.exists == 'true' && steps.manifest.outputs.stack == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: steps.manifest.outputs.exists == 'true' && steps.manifest.outputs.stack == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f setup.py ] || [ -f setup.cfg ] || [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "::warning::No Python dependency manifest found"
          fi

      # ── Lint ───────────────────────────────────────────────────────
      - name: Lint
        if: steps.manifest.outputs.exists == 'true' && steps.manifest.outputs.lint_cmd != ''
        env:
          ELIXPO_COMMAND: ${{ steps.manifest.outputs.lint_cmd }}
        run: bash -euo pipefail -c "$ELIXPO_COMMAND"

      # ── Test ───────────────────────────────────────────────────────
      - name: Test
        if: steps.manifest.outputs.exists == 'true' && steps.manifest.outputs.test_cmd != ''
        env:
          ELIXPO_COMMAND: ${{ steps.manifest.outputs.test_cmd }}
        run: bash -euo pipefail -c "$ELIXPO_COMMAND"

      # ── Build ──────────────────────────────────────────────────────
      - name: Build
        if: >-
          steps.manifest.outputs.exists == 'true'
          && steps.manifest.outputs.stack != 'static'
          && steps.manifest.outputs.stack != 'docker'
          && steps.manifest.outputs.build_cmd != ''
        env:
          ELIXPO_COMMAND: ${{ steps.manifest.outputs.build_cmd }}
        run: bash -euo pipefail -c "$ELIXPO_COMMAND"

      # ── Docker build ───────────────────────────────────────────────
      - name: Docker build
        if: steps.manifest.outputs.exists == 'true' && steps.manifest.outputs.stack == 'docker'
        run: docker build .
