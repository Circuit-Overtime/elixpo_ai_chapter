name: Publish @elixpo/lixsketch to NPM

on:
  push:
    branches:
      - main
    paths:
      - 'packages/lixsketch/**'
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump kind (patch / minor / major). Default: patch"
        required: false
        default: 'patch'

# The workflow tags the triggering commit but never pushes commits to protected
# branches. The npm registry remains the source of truth for released versions.
permissions:
  contents: write
  packages: write

concurrency:
  group: publish-lixsketch-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to NPM + GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Checkout only needs repository contents. Using the job token keeps
          # this step independent from the optional bot PAT, which may expire
          # or be unavailable to runs from protected environments.
          token: ${{ github.token }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Compute next version
        id: version
        working-directory: packages/lixsketch
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          # `npm view` can timeout / rate-limit and return "0.0.0" via the
          # fallback below, which then makes the LOCAL == REMOTE check
          # fail and skips the bump — even though the local version IS
          # already on npm. Treat any non-semver REMOTE as unknown and
          # fall back to "is LOCAL already published?" as the truth source.
          REMOTE=$(npm view @elixpo/lixsketch version 2>/dev/null || echo "unknown")
          BUMP="${{ github.event.inputs.bump || 'patch' }}"

          echo "Local  version: $LOCAL"
          echo "Remote version: $REMOTE"
          echo "Bump kind: $BUMP"

          # If the repository version is already published, advance it before
          # publishing. A manually bumped, unpublished version is used as-is.
          NEEDS_BUMP=false
          if [ "$LOCAL" = "$REMOTE" ]; then
            NEEDS_BUMP=true
          elif [ "$REMOTE" = "unknown" ]; then
            # `npm view` failed. Probe `npm view @scope/pkg@LOCAL` directly
            # — if that returns the version string, LOCAL is already on
            # npm and we must bump or the publish below 409's.
            if npm view "@elixpo/lixsketch@${LOCAL}" version >/dev/null 2>&1; then
              echo "LOCAL ($LOCAL) already exists on npm — bumping."
              NEEDS_BUMP=true
            fi
          fi

          if [ "$NEEDS_BUMP" = "true" ]; then
            # `npm version` in a workspace prints "<pkg-name>\nv<x.y.z>" —
            # capturing that into a shell var produces a multi-line value
            # which corrupts $GITHUB_OUTPUT. Bump silently and read the
            # new version back from package.json instead.
            npm version "$BUMP" --no-git-tag-version > /dev/null
            NEW=$(node -p "require('./package.json').version")
            echo "Bumped to $NEW"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "auto_bumped=true" >> "$GITHUB_OUTPUT"
          elif npm view "@elixpo/lixsketch@${LOCAL}" version >/dev/null 2>&1; then
            # Release-only version changes are not committed because main
            # requires PRs. Continue from the registry when it is ahead.
            if [ "$REMOTE" != "unknown" ] && [ "$LOCAL" != "$REMOTE" ]; then
              npm version "$REMOTE" --no-git-tag-version --allow-same-version > /dev/null
            fi
            npm version "$BUMP" --no-git-tag-version > /dev/null
            NEW=$(node -p "require('./package.json').version")
            echo "Local version already published; bumped from registry state to $NEW"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "auto_bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "Local ($LOCAL) ahead of remote ($REMOTE) — using local as-is."
            echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
            echo "auto_bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NPM
        id: npm_publish
        # `actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4` above wires `.npmrc` to use
        # ${NODE_AUTH_TOKEN}. The previous inline
        # `--//registry.npmjs.org/:_authToken=...` flag was producing
        # spurious E404 "Not Found - PUT" (= npm's auth-failed response)
        # on blogs.elixpo — switching to the env-var pattern fixed it
        # there, applying the same fix here pre-emptively.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_LIXSKETCH_PUBLISH_TOKEN }}
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          LOG="$RUNNER_TEMP/lixsketch-npm-publish.log"
          for ATTEMPT in 1 2 3; do
            if npm publish --access public > "$LOG" 2>&1; then
              cat "$LOG"
              VERSION=$(node -p "require('./package.json').version")
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            cat "$LOG"
            if ! grep -q 'Cannot publish over previously staged version' "$LOG"; then
              exit 1
            fi

            npm version "$BUMP" --no-git-tag-version > /dev/null
            VERSION=$(node -p "require('./package.json').version")
            echo "::warning::Version is already staged on npm; retrying with $VERSION."
          done

          echo "::error::Could not find an unpublished version after 3 attempts."
          exit 1
        working-directory: packages/lixsketch

      # ── Mirror to GitHub Packages ───────────────────────────────────
      - name: Reconfigure Node for GitHub Packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@elixpo'

      - name: Publish to GitHub Packages
        # Non-blocking — see blogs.elixpo/publish-npm.yml for the full
        # explanation; npmjs is the canonical registry, this mirror is
        # best-effort until org packages permissions are configured.
        continue-on-error: true
        working-directory: packages/lixsketch
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORIGINAL_REPO=$(node -p "JSON.stringify(require('./package.json').repository || null)")
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.repository = { type: 'git', url: 'git+https://github.com/${{ github.repository }}.git' };
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          if npm publish --access public --registry https://npm.pkg.github.com; then
            echo "::notice::Published to GitHub Packages."
          else
            echo "::warning::GitHub Packages publish failed (likely permission_denied: write_package). The npmjs publish above is canonical; this mirror is best-effort."
          fi
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            const orig = $ORIGINAL_REPO;
            if (orig) pkg.repository = orig; else delete pkg.repository;
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # Tag the triggering commit without creating a release-only commit on
      # protected main. Later runs continue from the npm registry version.
      - name: Tag the release
        run: |
          VERSION="${{ steps.npm_publish.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "lixsketch-v${VERSION}" -m "lixsketch v${VERSION}"
          git push origin "lixsketch-v${VERSION}"

      - name: Summary
        run: |
          echo "### Published @elixpo/lixsketch@${{ steps.npm_publish.outputs.version }} 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- npm: https://www.npmjs.com/package/@elixpo/lixsketch/v/${{ steps.npm_publish.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Packages: https://github.com/${{ github.repository }}/pkgs/npm/lixsketch" >> $GITHUB_STEP_SUMMARY
          echo "- Auto-bumped: \`${{ steps.version.outputs.auto_bumped }}\`" >> $GITHUB_STEP_SUMMARY
