# Production deployment adapted from blogs.elixpo.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — Workers Scripts: Edit and Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account identifier
#   NEXT_PUBLIC_ELIXPO_AUTH_CLIENT_ID — public Elixpo OAuth client identifier
#
# Runtime secrets remain configured on the Worker and Pages project. This
# workflow only supplies public values that Next.js compiles into the client.
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-worker:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy collaboration worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

  deploy-pages:
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate public build configuration
        env:
          NEXT_PUBLIC_ELIXPO_AUTH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ELIXPO_AUTH_CLIENT_ID }}
        run: |
          if [ -z "$NEXT_PUBLIC_ELIXPO_AUTH_CLIENT_ID" ]; then
            echo "::error::NEXT_PUBLIC_ELIXPO_AUTH_CLIENT_ID repository secret is required"
            exit 1
          fi

      - name: Build for Cloudflare Pages
        run: npx --no-install @cloudflare/next-on-pages
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_ELIXPO_AUTH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ELIXPO_AUTH_CLIENT_ID }}
          NEXT_PUBLIC_WORKER_URL: ${{ vars.NEXT_PUBLIC_WORKER_URL || 'https://sketch.elixpo.com' }}
          NEXT_PUBLIC_ROOM_WS_URL: ${{ vars.NEXT_PUBLIC_ROOM_WS_URL || 'wss://sketch.elixpo.com' }}
          NEXT_PUBLIC_LIXSKETCH_EMBED_ORIGINS: ${{ vars.NEXT_PUBLIC_LIXSKETCH_EMBED_ORIGINS || 'https://sketch.elixpo.com' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name lixsketch --branch main

  # D1 migrations intentionally remain manual via `npm run db:migrate`.
  # Schema changes must be applied before merging code that depends on them.
