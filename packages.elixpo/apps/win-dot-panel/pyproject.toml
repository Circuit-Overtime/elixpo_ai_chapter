[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "win-dot-panel"
version = "1.0.0"
description = "A keyboard-first emoji and clipboard panel for Linux"
readme = "README.md"
license = "MIT AND Unicode-3.0"
license-files = ["LICENSE", "src/win_dot_panel/resources/UNICODE-LICENSE.txt"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
insert = ["PyGObject>=3.42"]

[project.scripts]
win-dot-panel = "win_dot_panel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"win_dot_panel.storage" = ["*.sql"]
"win_dot_panel.resources" = ["emoji.json", "icon.png", "UNICODE-LICENSE.txt"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
