title: "[Service feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Share actionable feedback about an Elixpo-operated public service. Do not post passwords, access tokens, private account details, security vulnerabilities, or personal data here.
  - type: dropdown
    id: service
    attributes:
      label: Service
      description: Select the service most closely related to this feedback.
      options:
        - blogs.elixpo
        - sketch.elixpo
        - me.elixpo
        - search.elixpo
        - lixrl.com
        - accounts.elixpo
        - packages.elixpo
        - oreo.elixpo
        - status.elixpo
        - Other Elixpo service
    validations:
      required: true
  - type: dropdown
    id: feedback-type
    attributes:
      label: Feedback type
      options:
        - Usability or accessibility
        - Reliability or performance
        - Documentation
        - Feature request
        - General feedback
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What happened?
      description: Explain the task, the result you expected, and the result you observed. Include a public URL when useful.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Reproduction and environment
      description: Give concise steps and relevant browser, device, operating system, or package version details.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain who is affected and whether a workaround exists.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I have removed secrets, private account information, personal data, and undisclosed security details.
          required: true
