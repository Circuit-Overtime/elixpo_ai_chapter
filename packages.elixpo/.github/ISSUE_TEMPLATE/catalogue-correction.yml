name: Catalogue correction
description: Correct package metadata, attribution, lifecycle, documentation, or a public link.
title: "[Catalogue]: "
labels: ["SUPPORT"]
body:
  - type: input
    id: url
    attributes:
      label: Affected public URL
      placeholder: https://packages.elixpo.com/example/
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Required correction
      description: Identify the current statement and the precise replacement.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public evidence
      description: Link to authoritative source, release, license, or repository history.
    validations:
      required: true
