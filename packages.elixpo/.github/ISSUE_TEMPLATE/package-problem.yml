name: Package or installation problem
description: Report an application, installer, update, or package repository problem.
title: "[Package]: "
labels: ["BUGS"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options: [Win Dot Panel, ScreenBridge, APT repository, Package catalogue, npm package]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Include package version, distribution, desktop environment, and display protocol where relevant.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed and expected result
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked existing issues and removed credentials or private information from logs.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
