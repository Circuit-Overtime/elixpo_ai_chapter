name: Deploy packages.elixpo.com

on:
  workflow_call:
    secrets:
      APT_SIGNING_KEY:
        required: true
  workflow_dispatch:
  repository_dispatch:
    types:
      - package-released

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: packages-elixpo-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out package-site source
        uses: actions/checkout@v7

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Download latest stable packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          latest_tag() {
            python3 - "$1" <<'PY'
          import json
          import sys

          prefix = sys.argv[1]
          with open("releases.json", encoding="utf-8") as releases_file:
              releases = json.load(releases_file)
          candidates = [
              release for release in releases
              if not release["draft"]
              and not release["prerelease"]
              and release["tag_name"].startswith(prefix)
          ]
          candidates.sort(key=lambda release: release.get("published_at") or "", reverse=True)
          if candidates:
              print(candidates[0]["tag_name"])
          PY
          }

          clipboard_tag="$(latest_tag 'win-dot-panel/v')"
          screenbridge_tag="$(latest_tag 'screenbridge/v')"
          test -n "$clipboard_tag" || { echo 'No stable Win Dot Panel release found' >&2; exit 1; }
          test -n "$screenbridge_tag" || { echo 'No stable ScreenBridge release found' >&2; exit 1; }

          mkdir -p downloads/win-dot-panel downloads/screenbridge
          gh release download "$clipboard_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'win-dot-panel_*.deb' --pattern SHA256SUMS \
            --dir downloads/win-dot-panel
          gh release download "$screenbridge_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'screenbridge_[0-9]*_all.deb' --pattern SHA256SUMS \
            --dir downloads/screenbridge

      - name: Verify release assets
        run: |
          (cd downloads/win-dot-panel && sha256sum --check SHA256SUMS)
          (cd downloads/screenbridge && sha256sum --check SHA256SUMS)
          clipboard=(downloads/win-dot-panel/win-dot-panel_*.deb)
          screenbridge=(downloads/screenbridge/screenbridge_[0-9]*_all.deb)
          [[ ${#clipboard[@]} -eq 1 && -f "${clipboard[0]}" ]]
          [[ ${#screenbridge[@]} -eq 1 && -f "${screenbridge[0]}" ]]
          [[ "$(dpkg-deb --field "${clipboard[0]}" Package)" == "win-dot-panel" ]]
          [[ "$(dpkg-deb --field "${screenbridge[0]}" Package)" == "screenbridge" ]]

      - name: Prepare product pages
        run: |
          python3 scripts/prepare_site.py site
          python3 scripts/check_site.py site

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY" || {
            echo 'APT_SIGNING_KEY is required' >&2
            exit 1
          }
          export GNUPGHOME="$RUNNER_TEMP/elixpo-packages-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Build signed multi-package repository
        run: |
          clipboard=(downloads/win-dot-panel/win-dot-panel_*.deb)
          screenbridge=(downloads/screenbridge/screenbridge_[0-9]*_all.deb)
          bash scripts/build_apt_repo.sh site "${clipboard[0]}" "${screenbridge[0]}"

      - name: Validate repository contents and signatures
        run: |
          gzip -dc site/apt/Packages.gz > /tmp/elixpo-packages-index
          [[ "$(grep -c '^Package: win-dot-panel$' /tmp/elixpo-packages-index)" -eq 1 ]]
          [[ "$(grep -c '^Package: screenbridge$' /tmp/elixpo-packages-index)" -eq 1 ]]
          gpg --batch --verify site/apt/InRelease
          test -f site/apt/pool/win-dot-panel/win-dot-panel_*.deb
          test -f site/apt/pool/screenbridge/screenbridge_*.deb

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
