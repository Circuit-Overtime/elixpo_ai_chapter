name: Build and validate Debian package

on:
  workflow_call:
    outputs:
      release_tag:
        description: Tag for the validated package release
        value: ${{ jobs.build.outputs.release_tag }}

permissions:
  contents: read

jobs:
  build:
    name: Build and validate package
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/win-dot-panel
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Set package version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            revision="${GITHUB_REF_NAME##*-}"
            if [[ ! "$revision" =~ ^[1-9][0-9]*$ || "$GITHUB_REF_NAME" != "win-dot-panel/v${version}-${revision}" ]]; then
              echo "Tag must match win-dot-panel/v${version}-<positive Debian revision>" >&2
              exit 1
            fi
            echo "revision=$revision" >> "$GITHUB_OUTPUT"
            echo "deb_version=${version}-${revision}" >> "$GITHUB_OUTPUT"
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "revision=1" >> "$GITHUB_OUTPUT"
            echo "snapshot_run=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "deb_version=${version}~main.${GITHUB_RUN_NUMBER}-1" >> "$GITHUB_OUTPUT"
            echo "release_tag=main-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and inspect wheel
        run: |
          python -m pip install 'build>=1,<2'
          python -m build --wheel --outdir dist
          python scripts/check-wheel.py dist/win_dot_panel-*.whl
          python -m pip install --no-deps dist/win_dot_panel-*.whl
          win-dot-panel --help
      - name: Build Debian package
        run: |
          args=(--revision "${{ steps.version.outputs.revision }}")
          if [[ -n "${{ steps.version.outputs.snapshot_run }}" ]]; then
            args+=(--snapshot-run "${{ steps.version.outputs.snapshot_run }}")
          fi
          python scripts/build_deb.py dist/win_dot_panel-*.whl "${args[@]}"
      - name: Inspect Debian package
        run: |
          packages=(dist/win-dot-panel_*.deb)
          [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" ]]
          package="${packages[0]}"
          [[ "$(dpkg-deb --field "$package" Package)" == "win-dot-panel" ]]
          [[ "$(dpkg-deb --field "$package" Version)" == "${{ steps.version.outputs.deb_version }}" ]]
          depends=$(dpkg-deb --field "$package" Depends)
          [[ "$depends" == *python3-pyside6.qtwidgets* && "$depends" == *wl-clipboard* ]]
          dpkg-deb --extract "$package" extracted
          test -x extracted/usr/bin/win-dot-panel
          test -f extracted/usr/lib/python3/dist-packages/win_dot_panel/resources/emoji.json
          test -f extracted/usr/lib/python3/dist-packages/win_dot_panel/desktop/wayland_portal.py
          test -f extracted/usr/share/applications/win-dot-panel.desktop
          test -f extracted/usr/share/icons/hicolor/512x512/apps/win-dot-panel.png
          dpkg-deb --ctrl-tarfile "$package" | tar -tvf - | grep -q 'postinst$'
          test -f extracted/usr/lib/python3/dist-packages/win_dot_panel/storage/schema.sql
          test -f extracted/usr/share/doc/win-dot-panel/copyright
          PYTHONPATH="$PWD/extracted/usr/lib/python3/dist-packages" extracted/usr/bin/win-dot-panel --help
          (cd dist && sha256sum win-dot-panel_*.deb > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: validated-debian-package
          path: |
            apps/win-dot-panel/dist/win-dot-panel_*.deb
            apps/win-dot-panel/dist/SHA256SUMS
          if-no-files-found: error
