name: Frontend quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify canonical registry snapshot
        run: npm run registry:check
      - name: Lint frontend
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
