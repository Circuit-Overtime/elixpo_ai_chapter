[workspace]
members = [
    "crates/crumb-a2a",
    "crates/crumb-a2a-exchanges",
    "crates/crumb-a2a-inbound",
    "crates/crumb-a2a-local",
    "crates/crumb-a2a-runtime",
    "crates/crumb-a2a-tasks",
    "crates/crumb-agent",
    "crates/crumb-auth",
    "crates/crumb-cli",
    "crates/crumb-core",
    "crates/crumb-history",
    "crates/crumb-instance",
    "crates/crumb-graph",
    "crates/crumb-harness-dsh",
    "crates/crumb-harness-cli",
    "crates/crumb-harness",
    "crates/crumb-llm",
    "crates/crumb-marketplace",
    "crates/crumb-memory",
    "crates/crumb-mcp",
    "crates/crumb-native",
    "crates/crumb-optimize",
    "crates/crumb-platform",
    "crates/crumb-profile",
    "crates/crumb-pollinations",
    "crates/crumb-pty",
    "crates/crumb-repl",
    "crates/crumb-tools",
    "crates/crumb-ui",
]
resolver = "2"

[workspace.package]
version = "1.0.4"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/elixpo/crumb.elixpo"
homepage = "https://crumb.elixpo.com"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anyhow = "1.0.100"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.22.1"
bytes = "1.11"
chrono = "0.4.45"
crossterm = "0.29.0"
crumb-a2a = { path = "crates/crumb-a2a" }
crumb-a2a-exchanges = { path = "crates/crumb-a2a-exchanges" }
crumb-a2a-inbound = { path = "crates/crumb-a2a-inbound" }
crumb-a2a-local = { path = "crates/crumb-a2a-local" }
crumb-a2a-runtime = { path = "crates/crumb-a2a-runtime" }
crumb-a2a-tasks = { path = "crates/crumb-a2a-tasks" }
crumb-instance = { path = "crates/crumb-instance" }
ctrlc = "3.4.7"
directories = "6.0.0"
futures-util = "0.3.34"
getrandom = "0.4.2"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = "4.1.6"
nu-ansi-term = "0.50.3"
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", features = ["blocking", "form", "json", "stream"] }
reedline = { version = "0.52.1", default-features = false }
rusqlite = "0.40.2"
rustix = { version = "1.1.4", features = ["event", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10.9"
sigstore-trust-root = { version = "0.15.0", default-features = false }
sigstore-types = "0.15.0"
sigstore-verify = "0.15.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["time"] }
zeroize = "1.9"
url = "2.5.8"
