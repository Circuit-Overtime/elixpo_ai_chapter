name: Elixpo Repository Agent

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, review_requested]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number
        required: true
        type: number
      scope:
        description: Target type
        required: true
        type: choice
        options: [issue, pull_request]
      request:
        description: Work to perform
        required: true
        type: string

concurrency:
  group: elixpo-agent-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.repository_owner == 'elixpo' && github.actor != 'elixpoo')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Authorize exact request
        id: gate
        uses: actions/github-script@v7
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_NUMBER: ${{ inputs.number }}
          INPUT_REQUEST: ${{ inputs.request }}
          TRUSTED_USERS: ${{ vars.ELIXPO_MENTION_TRUSTED_USERS || 'Circuit-Overtime,anwe-ch,elixpoo,ez-vivek' }}
        with:
          github-token: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
          script: |
            const trusted = new Set((process.env.TRUSTED_USERS || '').split(',').map(v => v.trim()).filter(Boolean));
            const event = context.eventName;
            const payload = context.payload;
            let scope = process.env.INPUT_SCOPE || '';
            let number = Number(process.env.INPUT_NUMBER || 0);
            let request = process.env.INPUT_REQUEST || '';
            let structured = false;
            if (event === 'issues') {
              scope = 'issue'; number = payload.issue.number;
              request = `${payload.issue.title}\n\n${payload.issue.body || ''}`;
            } else if (event === 'issue_comment') {
              scope = payload.issue.pull_request ? 'pull_request' : 'issue';
              number = payload.issue.number; request = payload.comment.body || '';
            } else if (event === 'pull_request_review_comment') {
              scope = 'pull_request'; number = payload.pull_request.number;
              request = payload.comment.body || '';
            } else if (event === 'pull_request_review') {
              scope = 'pull_request'; number = payload.pull_request.number;
              request = payload.review.body || '';
            } else if (event === 'pull_request') {
              scope = 'pull_request'; number = payload.pull_request.number;
              structured = payload.action === 'review_requested' && payload.requested_reviewer?.login === 'elixpoo';
              request = structured ? 'Review this pull request for blocking correctness issues.' : `${payload.pull_request.title}\n\n${payload.pull_request.body || ''}`;
            }
            const mention = /(^|[^A-Za-z0-9_.+-])@elixpoo([^A-Za-z0-9_.+-]|$)/i.test(request);
            const authorized = trusted.has(context.actor) && (event === 'workflow_dispatch' || structured || mention);
            core.setOutput('authorized', String(authorized));
            core.setOutput('scope', scope);
            core.setOutput('number', String(number));
            core.setOutput('request_b64', Buffer.from(request).toString('base64'));

      - name: Checkout centralized OreoFlow runtime
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          repository: elixpo/agent.elixpo
          ref: ${{ vars.OREOFLOW_RUNTIME_REF || 'main' }}
          path: .oreoflow-runtime
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.authorized == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bounded runtime
        if: steps.gate.outputs.authorized == 'true'
        run: pip install -e .oreoflow-runtime

      - name: Respond, review, or route implementation to OreoFlow
        if: steps.gate.outputs.authorized == 'true'
        env:
          ELIXPOO_GITHUB_AGENTIC_TOKEN: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
          ELIXPO_POLLINATIONS_API_KEY: ${{ secrets.ELIXPO_POLLINATIONS_API_KEY }}
          ELIXPO_GITHUB_CONTROL_REPO: ${{ vars.ELIXPO_GITHUB_CONTROL_REPO || 'elixpo/agent.elixpo' }}
          ELIXPO_AGENT_RECEIPT_DIR: ${{ runner.temp }}/oreoflow-repository-agent
          REQUEST_B64: ${{ steps.gate.outputs.request_b64 }}
          TARGET_SCOPE: ${{ steps.gate.outputs.scope }}
          TARGET_NUMBER: ${{ steps.gate.outputs.number }}
        run: |
          request=$(printf '%s' "$REQUEST_B64" | base64 --decode)
          python -m agents.repository_agent \
            --repository "${{ github.repository }}" \
            --scope "$TARGET_SCOPE" \
            --number "$TARGET_NUMBER" \
            --request "$request"

      - name: Upload contracted run receipt
        if: always() && steps.gate.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: repository-agent-${{ github.run_id }}
          path: ${{ runner.temp }}/oreoflow-repository-agent
          if-no-files-found: warn
          retention-days: 14
