name: Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Rust workspace and website build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crumb.elixpo/package-lock.json

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets

      - name: Audit website dependencies
        working-directory: crumb.elixpo
        run: npm audit --audit-level=low

      - name: Check published marketplace indexes
        run: node .github/scripts/publish-marketplace.mjs --check

      - name: Validate repository installers
        run: |
          sh -n install.sh
          sh -n scripts/test-install.sh
          scripts/test-install.sh

      - name: Parse the Windows installer
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Build Crumb website
        run: ./deploy.sh --worker build
