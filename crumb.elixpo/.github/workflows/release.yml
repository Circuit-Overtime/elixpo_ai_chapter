name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag matching the Cargo workspace version, for example v1.0.2
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
      publish:
        description: Publish the verified artifacts as a GitHub Release
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type RELEASE when publish is enabled; staging runs may use STAGE
        required: true
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  authorize:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Require main and an explicit confirmation
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Public releases must be dispatched from main."
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$CONFIRMATION" != "RELEASE" ]; then
            echo "::error::Type RELEASE in the confirmation field."
            exit 1
          fi
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$REQUESTED_VERSION" != "v$cargo_version" ]; then
            echo "::error::Requested tag $REQUESTED_VERSION does not match Cargo version v$cargo_version."
            exit 1
          fi
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            binary: crumb
            archive: tar.gz
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
            binary: crumb
            archive: tar.gz
            deb_arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
            binary: crumb
            archive: tar.gz
            deb_arch: ''
          - runner: macos-15
            target: aarch64-apple-darwin
            label: macos-aarch64
            binary: crumb
            archive: tar.gz
            deb_arch: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            binary: crumb.exe
            archive: zip
            deb_arch: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build locked release binary
        run: cargo build --locked --release -p crumb-cli --target ${{ matrix.target }}
      - name: Assemble release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/stage -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/stage/${{ matrix.binary }}"
          Copy-Item README.md dist/stage/README.md
          Copy-Item LICENSE dist/stage/LICENSE
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: dist/stage
          format: spdx-json
          output-file: dist/crumb-${{ matrix.label }}.sbom.spdx.json
          upload-artifact: false
      - name: Create release archive and checksum
        shell: pwsh
        run: |
          $asset = "crumb-${{ matrix.label }}.${{ matrix.archive }}"
          if ("${{ matrix.archive }}" -eq "zip") {
            Compress-Archive -Path "dist/stage/*" -DestinationPath "dist/$asset"
          } else {
            tar -C dist/stage -czf "dist/$asset" .
          }
          $digest = (Get-FileHash -Algorithm SHA256 "dist/$asset").Hash.ToLowerInvariant()
          "$digest  $asset" | Set-Content -NoNewline "dist/$asset.sha256"
      - name: Build Debian package
        if: matrix.deb_arch != ''
        shell: bash
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          bash packaging/debian/build-deb.sh \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "$VERSION" "$DEB_ARCH" dist
          deb=(dist/crumb_*.deb)
          deb_name=$(basename "${deb[0]}")
          (cd dist && sha256sum "$deb_name" > "$deb_name.sha256")
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release archive with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/crumb-${{ matrix.label }}.${{ matrix.archive }}"
          cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
      - name: Sign Debian package with GitHub OIDC
        if: matrix.deb_arch != ''
        shell: bash
        run: |
          set -euo pipefail
          deb=(dist/crumb_*.deb)
          cosign sign-blob --yes --bundle "${deb[0]}.sigstore.json" "${deb[0]}"
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/crumb-${{ matrix.label }}.${{ matrix.archive }}
      - name: Attest Debian package provenance
        if: matrix.deb_arch != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/crumb_*.deb
      - name: Upload verified release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.label }}
          path: |
            dist/crumb-${{ matrix.label }}.${{ matrix.archive }}
            dist/crumb-${{ matrix.label }}.${{ matrix.archive }}.sha256
            dist/crumb-${{ matrix.label }}.${{ matrix.archive }}.sigstore.json
            dist/crumb-${{ matrix.label }}.sbom.spdx.json
            dist/crumb_*.deb
            dist/crumb_*.deb.sha256
            dist/crumb_*.deb.sigstore.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [authorize, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.authorize.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then prerelease_flag=(--prerelease); fi
          gh release create "$VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Crumb $VERSION" \
            --generate-notes \
            "${prerelease_flag[@]}"
