title: "[Announcement] "
body:
  - type: markdown
    attributes:
      value: |
        Announcements record verified releases, programme updates, governance decisions, maintenance changes, and important retirements. Publish only claims that can be supported by a canonical public source.
  - type: dropdown
    id: announcement-type
    attributes:
      label: Announcement type
      options:
        - Release
        - Research publication
        - Service or infrastructure update
        - Community programme
        - Governance or policy decision
        - Maintenance, pause, or retirement
    validations:
      required: true
  - type: input
    id: canonical-record
    attributes:
      label: Canonical public record
      description: Link the release, repository decision, research record, policy, status entry, or other source of truth.
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What changed?
      description: Describe the verified change, its effective date, and who is affected.
    validations:
      required: true
  - type: textarea
    id: follow-up
    attributes:
      label: Follow-up and ownership
      description: Name the responsible maintainers and link the appropriate place for questions or corrections.
    validations:
      required: true
