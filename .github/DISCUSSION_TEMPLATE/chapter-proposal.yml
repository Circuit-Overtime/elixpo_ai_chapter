title: "[Chapter proposal] "
body:
  - type: markdown
    attributes:
      value: |
        Propose a time-bounded Elixpo Chapter around a clear public outcome. A proposal begins a discussion; it does not guarantee acceptance, repository transfer, funding, or endorsement.
  - type: input
    id: project
    attributes:
      label: Project or repository
      description: Link the existing repository or describe where the work will begin.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Public outcome
      description: What useful release, research artifact, documentation, or service improvement should this Chapter produce?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and completion criteria
      description: Define what is included, what is excluded, and how contributors will know the Chapter is complete.
    validations:
      required: true
  - type: input
    id: timeline
    attributes:
      label: Proposed timeline
      description: Give an approximate start, review, and release window.
      placeholder: "Start: YYYY-MM-DD; target release: YYYY-MM-DD"
    validations:
      required: true
  - type: textarea
    id: roles
    attributes:
      label: Maintainers and contribution paths
      description: Name accountable maintainers and list concrete ways another person can contribute.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Existing evidence and dependencies
      description: Link relevant issues, releases, prototypes, papers, datasets, or external dependencies.
    validations:
      required: false
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Public-work acknowledgement
      options:
        - label: I understand that decisions, contribution evidence, status changes, and the final outcome will be recorded publicly.
          required: true
