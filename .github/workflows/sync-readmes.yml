name: Synchronize public READMEs

on:
  push:
    branches: [main]
    paths:
      - "content/organization.json"
      - "content/repositories.json"
      - "content/taxonomy.json"
      - "content/licensing.json"
      - "content/sponsorship.json"
      - "content/readme/**"
      - "docs/readme/generated/**"
      - "scripts/render-readmes.mjs"
      - "scripts/validate-registry.mjs"
      - "package.json"
      - ".github/workflows/sync-readmes.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: synchronize-public-readmes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  synchronize:
    name: Open synchronization pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the canonical source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate registry and generated outputs
        run: |
          npm run registry:check
          npm run readme:check

      - name: Require the scoped synchronization token
        env:
          SYNC_TOKEN: ${{ secrets.ELIXPO_README_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::ELIXPO_README_SYNC_TOKEN is not configured. See docs/readme/synchronization.md."
            exit 1
          fi

      - name: Check out the organization profile repository
        uses: actions/checkout@v5
        with:
          repository: elixpo/.github
          ref: main
          path: _sync/organization
          token: ${{ secrets.ELIXPO_README_SYNC_TOKEN }}

      - name: Check out the Chapter repository
        uses: actions/checkout@v5
        with:
          repository: elixpo/elixpo_chapter
          ref: main
          path: _sync/chapter
          token: ${{ secrets.ELIXPO_README_SYNC_TOKEN }}

      - name: Open or update downstream pull requests
        env:
          GH_TOKEN: ${{ secrets.ELIXPO_README_SYNC_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          sync_readme() {
            local repository="$1"
            local checkout_path="$2"
            local generated_readme="$3"
            local destination="$4"
            local branch="automation/sync-elixpo-readme"

            cp "$GITHUB_WORKSPACE/$generated_readme" "$GITHUB_WORKSPACE/$checkout_path/$destination"
            cd "$GITHUB_WORKSPACE/$checkout_path"

            if git diff --quiet -- "$destination"; then
              echo "$repository is already synchronized."
              return
            fi

            git config user.name "elixpo-readme-sync[bot]"
            git config user.email "elixpo-readme-sync[bot]@users.noreply.github.com"
            git fetch origin "$branch:refs/remotes/origin/$branch" || true
            git checkout -B "$branch"
            git add "$destination"
            git commit -m "docs: synchronize Elixpo public brief"
            git push --force-with-lease --set-upstream origin "$branch"

            local body
            body=$(printf '%s\n\n%s\n\n%s' \
              'Synchronizes the generated Elixpo organization brief from the canonical portal registry.' \
              "Source commit: elixpo/elixpo@$SOURCE_SHA" \
              'Do not edit the generated shared block directly; update the canonical registry or README source instead.')

            local existing
            existing=$(gh pr list --repo "$repository" --state open --head "$branch" --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh pr edit "$existing" --repo "$repository" \
                --title "docs: synchronize Elixpo public brief" \
                --body "$body"
              echo "Updated $repository PR #$existing."
            else
              gh pr create --repo "$repository" --base main --head "$branch" \
                --title "docs: synchronize Elixpo public brief" \
                --body "$body"
            fi
          }

          sync_readme \
            "elixpo/.github" \
            "_sync/organization" \
            "docs/readme/generated/organization.md" \
            "profile/README.md"

          sync_readme \
            "elixpo/elixpo_chapter" \
            "_sync/chapter" \
            "docs/readme/generated/chapter.md" \
            "README.md"
