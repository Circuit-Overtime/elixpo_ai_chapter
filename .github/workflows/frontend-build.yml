name: Frontend production build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: frontend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble and inspect static package site
        run: |
          python3 scripts/prepare_site.py site
          python3 scripts/check_site.py site
