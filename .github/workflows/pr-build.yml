# Cloudflare compatibility and trusted previews are separate from the faster
# unit-test workflow. The build is secretless and safe for fork pull requests.
name: PR Cloudflare build

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The production adapter catches Cloudflare edge-runtime incompatibilities
      # that can pass a plain Next.js build.
      - name: Build for Cloudflare Pages
        run: npm run pages:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Summarize the build
        if: always()
        run: |
          {
            echo "## Cloudflare build"
            echo
            echo 'This check installs from the lockfile and runs `npm run pages:build` on Node 22.'
            echo
            echo "Run the same commands locally:"
            echo '```bash'
            echo "npm ci"
            echo "npm run pages:build"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Deploy trusted preview
    needs: build
    # Contributor-controlled code from a fork must never receive deployment
    # credentials. Draft pull requests also skip preview infrastructure.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.lixblogs.pages.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run pages:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_URL: https://pr-${{ github.event.pull_request.number }}.lixblogs.pages.dev
          NEXT_PUBLIC_ELIXPO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ELIXPO_CLIENT_ID }}

      - name: Deploy preview to Cloudflare Pages
        run: >-
          npx wrangler pages deploy .vercel/output/static
          --project-name lixblogs
          --branch "pr-${{ github.event.pull_request.number }}"
          --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summarize the preview
        run: |
          {
            echo "## Reviewer preview"
            echo
            echo "Review this commit at https://pr-${{ github.event.pull_request.number }}.lixblogs.pages.dev"
            echo
            echo 'This preview does not apply D1 migrations, deploy Workers, or publish packages.'
          } >> "$GITHUB_STEP_SUMMARY"
