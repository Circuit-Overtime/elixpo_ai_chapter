# Fast, secretless test feedback for every pull request, including forks.
name: PR tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Summarize the test run
        if: always()
        run: |
          {
            echo "## Unit tests"
            echo
            echo 'This check installs from the lockfile and runs `npm test` on Node 22.'
            echo
            echo "Run the same commands locally:"
            echo '```bash'
            echo "npm ci"
            echo "npm test"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
