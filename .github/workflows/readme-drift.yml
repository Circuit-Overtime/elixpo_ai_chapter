name: Verify Chapter README source

on:
  # This check is required by the main-branch ruleset, so it must report for
  # every pull request. The comparison is cheap and keeps non-README changes
  # from waiting forever on a path-filtered check that never starts.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify canonical Chapter README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare generated output
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/elixpo/elixpo_chapter/${CANDIDATE_SHA}/README.md" \
            --output candidate.md
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/elixpo/elixpo/main/docs/readme/generated/chapter.md" \
            --output canonical.md
          cmp canonical.md candidate.md
