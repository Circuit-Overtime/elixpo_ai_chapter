# Repository automation that is separate from validation and deployment.
# `.github/workflows/deploy.yml` owns the Accounts quality gate.
#
# What this does:
#   PR opened          → auto-label, auto-assign
#   issue/PR agent work is owned by the separately gated OreoFlow workflows
#   weekly cron        → stale issue/PR cleanup

name: Elixpo CI

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Weekly Monday 9 AM UTC — stale cleanup

jobs:
  pr-manage:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    uses: ./.github/workflows/pr-management.yml
    secrets: inherit

  stale:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/stale-management.yml
    secrets: inherit
