name: Subtree Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: subtree-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_AGENT_TOKEN }}

      - name: Configure git as elixpoo
        run: |
          git config user.name "elixpoo"
          git config user.email "elixpoo@gmail.com"

      # Every changed subtree is collected on one isolated branch and reviewed
      # through one squash-auto-merge PR. Per-project sync state is persisted at
      # .github/.sync-state/<name> without multiplying full-repository CI runs.
      - name: Sync changed subtrees through one aggregate PR
        env:
          GH_TOKEN: ${{ secrets.CI_AGENT_TOKEN }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -u

          repos=(
            # Agent, Crumb, and OreoPI remain outside ordinary subtree updates
            # until their shared architecture and repository boundaries settle.
            "payouts.elixpo https://github.com/elixpo/payouts.elixpo"
            "status.elixpo https://github.com/elixpo/status.elixpo"
            "mails.elixpo https://github.com/elixpo/mail.elixpo"
            "admin.elixpo https://github.com/elixpo/admin.elixpo"
            "elixpo https://github.com/elixpo/elixpo.git"
            "art.elixpo https://github.com/elixpo/art.elixpo.git"
            "jackey.elixpo https://github.com/elixpo/jackey.elixpo.git"
            "chat.elixpo https://github.com/elixpo/chat.elixpo.git"
            "blogs.elixpo https://github.com/elixpo/blogs.elixpo.git"
            "clock.elixpo https://github.com/elixpo/clock.elixpo.git"
            "sketch.elixpo https://github.com/elixpo/sketch.elixpo.git"
            "me.elixpo https://github.com/elixpo/me.elixpo.git"
            "accounts.elixpo https://github.com/elixpo/accounts.elixpo.git"
            "search.elixpo https://github.com/pollinations/search.elixpo.git"
            "lixrl.com https://github.com/elixpo/lixrl.com.git"
            "tommy.elixpo https://github.com/elixpo/tommy.elixpo.git"
            "rewrite.elixpo https://github.com/elixpo/rewrite.elixpo.git"
            "wish.elixpo https://github.com/elixpo/wish.elixpo.git"
            "claudeOps.elixpo https://github.com/elixpo/claudeOps.elixpo.git"
            "packages.elixpo https://github.com/elixpo/packages.elixpo"
            "oreo https://github.com/elixpo/oreo"
            # Open Research records are projects in their own right. Mirroring
            # them here preserves the combined source collection; it does not
            # imply that a formal, time-bounded Chapter has been opened.
            "octabit https://github.com/elixpo/octabit"
            "emoji_transnetv1 https://github.com/elixpo/emoji_transnetv1"
            "falcon https://github.com/elixpo/falcon"
            "qfabric https://github.com/elixpo/qfabric"
            "monodiffuse https://github.com/elixpo/monodiffuse"
            "wozformer https://github.com/elixpo/wozformer"
            "nano28C64 https://github.com/elixpo/nano28C64"
          )

          STATE_DIR=.github/.sync-state
          SYNC_LABEL="subtree-sync"
          BRANCH="automation/subtree-sync-${GITHUB_RUN_ID}"
          SUMMARY_FILE=$(mktemp)
          UPDATED=0
          FAILED=0

          gh label create "$SYNC_LABEL" \
            --color "1d76db" \
            --description "Automated aggregate subtree synchronization" \
            2>/dev/null || true

          pending_pr=$(gh pr list --repo "$REPO_FULL" --state open --label "$SYNC_LABEL" \
            --limit 1 --json url --jq '.[0].url // empty')
          if [ -n "$pending_pr" ]; then
            echo "A subtree synchronization PR is already open: $pending_pr"
            echo "Refusing to create a duplicate wave."
            exit 0
          fi

          git checkout -b "$BRANCH" origin/main
          mkdir -p "$STATE_DIR"

          sync_one() {
            local name="$1" url="$2"
            local remote_tip prev_tip before_tip op_label upstream_log files_changed short_tip
            echo "==> $name"

            if ! git remote get-url "$name" >/dev/null 2>&1; then
              git remote add "$name" "$url"
            fi
            if ! git fetch --quiet "$name"; then
              echo "    fetch failed — skipping"
              FAILED=$((FAILED + 1))
              return 0
            fi

            remote_tip=$(git rev-parse "${name}/main" 2>/dev/null || echo "")
            if [ -z "$remote_tip" ]; then
              echo "    remote has no main branch — skipping"
              FAILED=$((FAILED + 1))
              return 0
            fi

            prev_tip=""
            [ -f "$STATE_DIR/${name}" ] && prev_tip=$(cat "$STATE_DIR/${name}")
            if [ "$prev_tip" = "$remote_tip" ]; then
              echo "    up to date ($remote_tip)"
              return 0
            fi

            before_tip=$(git rev-parse HEAD)
            if [ -d "$name" ] && git ls-tree --name-only HEAD | grep -qx "$name"; then
              op_label="pull"
              if ! git subtree pull --prefix="$name" "$name" main -m "Sync ${name} from upstream"; then
                echo "    subtree pull failed — retrying as a clean re-add"
                git merge --abort 2>/dev/null || true
                git reset --hard "$before_tip"
                git rm -rf "$name/" 2>/dev/null || true
                git commit -m "Reset ${name} subtree for re-sync" || true
                if ! git subtree add --prefix="$name" "$name" main -m "Re-add ${name} subtree"; then
                  echo "    re-add failed — restoring the aggregate branch"
                  git reset --hard "$before_tip"
                  FAILED=$((FAILED + 1))
                  return 0
                fi
                op_label="re-add"
              fi
            else
              op_label="add"
              if ! git subtree add --prefix="$name" "$name" main -m "Add ${name} subtree"; then
                echo "    add failed — restoring the aggregate branch"
                git reset --hard "$before_tip"
                FAILED=$((FAILED + 1))
                return 0
              fi
            fi

            files_changed=$(git diff --shortstat "$before_tip" HEAD -- "$name" | sed 's/^[[:space:]]*//')
            if [ -z "$files_changed" ]; then
              echo "    upstream tip changed without a content diff"
            fi

            if [ -n "$prev_tip" ] && git rev-parse --quiet --verify "$prev_tip" >/dev/null; then
              upstream_log=$(git log "${prev_tip}..${remote_tip}" --format='- %s (%h) — %an' 2>/dev/null | head -40)
            else
              upstream_log=$(git log "$remote_tip" --format='- %s (%h) — %an' -20 2>/dev/null)
            fi
            [ -z "$upstream_log" ] && upstream_log="_(no upstream commit log available)_"

            echo "$remote_tip" > "$STATE_DIR/${name}"
            git add "$STATE_DIR/${name}"
            git commit -m "chore: record sync state for ${name}" || true

            short_tip="${remote_tip:0:12}"
            {
              printf '## `%s`\n\n' "$name"
              printf -- '- **Source:** %s\n' "$url"
              printf -- '- **Upstream tip:** `%s`\n' "$short_tip"
              printf -- '- **Operation:** %s\n' "$op_label"
              printf -- '- **Diff:** %s\n\n' "${files_changed:-state-only update}"
              printf '%s\n\n' "$upstream_log"
            } >> "$SUMMARY_FILE"
            UPDATED=$((UPDATED + 1))
          }

          for entry in "${repos[@]}"; do
            name=${entry%% *}
            url=${entry#* }
            sync_one "$name" "$url"
          done

          if [ "$UPDATED" -eq 0 ]; then
            echo "All subtrees are synchronized."
            exit 0
          fi

          if ! git push --set-upstream origin "$BRANCH"; then
            echo "Unable to publish aggregate synchronization branch."
            exit 1
          fi

          title="Sync ${UPDATED} subtree(s) from upstream"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            "This aggregate PR synchronizes every changed project subtree detected in workflow run ${GITHUB_RUN_ID}." \
            "One aggregate PR avoids duplicate branch races and runs the required checks once." \
            "Updated: ${UPDATED} · Skipped after failure: ${FAILED}" \
            "$(cat "$SUMMARY_FILE")" \
            "Co-authored-by: Circuit-Overtime <ayushbhatt633@gmail.com>
          Co-authored-by: anwe-ch <misschakraborty2004@gmail.com>")

          if ! pr_url=$(gh pr create --repo "$REPO_FULL" --title "$title" --body "$body" \
            --head "$BRANCH" --base main --label "$SYNC_LABEL"); then
            echo "Unable to create aggregate subtree PR."
            git push origin --delete "$BRANCH" 2>/dev/null || true
            exit 1
          fi
          echo "Opened $pr_url"

          if ! gh pr merge "$pr_url" --auto --squash --delete-branch --subject "$title" --body "$body"; then
            echo "Unable to queue squash auto-merge; leaving $pr_url open for inspection."
            exit 1
          fi

          waited=0
          while true; do
            pr_state=$(gh pr view "$pr_url" --repo "$REPO_FULL" --json state --jq .state)
            if [ "$pr_state" = "MERGED" ]; then
              echo "Aggregate subtree synchronization merged."
              break
            fi
            if [ "$pr_state" = "CLOSED" ]; then
              echo "Aggregate subtree PR closed without merging."
              exit 1
            fi
            if [ "$waited" -ge 900 ]; then
              echo "Aggregate subtree PR remains queued after fifteen minutes: $pr_url"
              exit 1
            fi
            sleep 10
            waited=$((waited + 10))
          done
