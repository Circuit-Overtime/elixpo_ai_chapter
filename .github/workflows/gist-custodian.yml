name: Gist memory custodian

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect without writing
        type: boolean
        default: true
      repair:
        description: Reset corrupted managed files
        type: boolean
        default: false
      confirm_reset:
        description: Confirm corrupted-file reset
        type: boolean
        default: false

concurrency:
  group: state-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Prune and compact shared Gist memory
        env:
          ELIXPOO_GIST_AGENTIC_TOKEN: ${{ secrets.ELIXPOO_GIST_AGENTIC_TOKEN }}
          ELIXPOO_FOLLOWUP_GIST_ID: ${{ vars.ELIXPOO_FOLLOWUP_GIST_ID }}
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          if [[ "${{ inputs.repair }}" == "true" ]]; then args+=(--repair); fi
          if [[ "${{ inputs.confirm_reset }}" == "true" ]]; then args+=(--confirm-reset); fi
          python -m agents.gist_custodian "${args[@]}"
      - name: Commit custodian receipt
        if: always()
        env:
          CONTROL_TOKEN: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
        run: |
          if [[ ! -f state/gist_custodian.json ]]; then exit 0; fi
          git config user.name "elixpoo"
          git config user.email "elixpoo@gmail.com"
          git add state/gist_custodian.json state/contracts.json
          git diff --cached --quiet || git commit -m "chore(gist): record memory maintenance"
          auth=$(printf 'x-access-token:%s' "$CONTROL_TOKEN" | base64 -w 0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push
