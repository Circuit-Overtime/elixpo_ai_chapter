schema_version: "0.1"

project:
  id: blogs
  name: blogs.elixpo
  title: LixBlogs
  description: "Open-source collaborative publishing platform with rich editing, multi-tenant publications, API and CLI automation."
  family: service
  artifact_type: hosted-service
  lifecycle: active
  relationship: core
  custody: elixpo-owned
  stack: nextjs
  node_version: "22"
  repository: https://github.com/elixpo/blogs.elixpo
  deployment: https://blogs.elixpo.com
  discussions: https://github.com/orgs/elixpo/discussions
  status_owner: elixpo
  status_verified_at: "2026-10-16"

