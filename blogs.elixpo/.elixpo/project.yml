  lint_cmd: ""
  test_cmd: "npm test"
  build_cmd: "npm run pages:build"

operations:
  deployment_workflow: .github/workflows/deploy.yml
  test_workflow: .github/workflows/pr-tests.yml
  build_workflow: .github/workflows/pr-build.yml
  preview_workflow: .github/workflows/pr-build.yml
  privileged_workflows_repo_specific: true
  fork_prs_receive_secrets: false

maintainers:
  - github: Circuit-Overtime
    skills: [frontend, nextjs, ui, cloudflare, d1]
    lead: true

governance:
  model: maintainer-led
  document: GOVERNANCE.md

support:
  document: SUPPORT.md

security:
  document: SECURITY.md

gist:
  id: ""
  account: elixpoo
