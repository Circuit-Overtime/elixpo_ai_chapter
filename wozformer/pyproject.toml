[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wozformer"
version = "0.1.0"
description = "Tiny language models for vintage silicon — HDC + RWKV + binary weights + 6502 deployment"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["wozformer*"]
exclude = ["alphalm*", "notebooks*", "firmware*", "hardware*", "data*", "export*", "tests*", "reference*"]
