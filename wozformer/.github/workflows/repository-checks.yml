name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  research:
    name: Paused research integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify importable source syntax
        run: python -m compileall -q wozformer alphalm scripts

      - name: Verify notebook records are valid JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = sorted(Path("notebooks").glob("*.ipynb"))
          if not notebooks:
              raise SystemExit("No research notebooks found")
          for notebook in notebooks:
              with notebook.open(encoding="utf-8") as handle:
                  json.load(handle)
          print(f"Validated {len(notebooks)} notebook records")
          PY

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- '*.py' '*.md'; then
            echo "Unresolved merge markers found in the research record." >&2
            exit 1
          fi
